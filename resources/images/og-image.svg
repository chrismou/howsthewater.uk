  <text x="80" y="430" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" fill="#3a464f">Storm overflow spills upstream, river levels and rainfall</text>
  <text x="80" y="470" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" fill="#3a464f">for swimming, paddling and fishing spots, every 15 minutes.</text>
